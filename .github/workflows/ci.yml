name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Placeholders only — the foundation never connects to a real database,
  # but Prisma and the build expect the variables to be present.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/gymsaas_ci
  APP_URL: http://localhost:3000
  # Clerk keys for the dedicated CI development instance, supplied via
  # GitHub Actions secrets (never committed). A real test-mode instance is
  # required: browser tests must complete Clerk's dev-browser handshake,
  # which a dummy key cannot (see playwright.config.ts).
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_CI_PUBLISHABLE_KEY }}
  CLERK_SECRET_KEY: ${{ secrets.CLERK_CI_SECRET_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        # The generated client (node_modules/.prisma/client) is gitignored and
        # not produced by `npm ci` (no postinstall hook). Typecheck, unit tests
        # and the app all import model types from `@prisma/client`, which
        # re-exports the generated files — without this step the Typecheck
        # step fails with TS2305 (e.g. "has no exported member 'PrismaClient'").
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit/application tests (Vitest)
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests (Playwright)
        run: npm run test:e2e

      - name: Production build
        run: npm run build

      - name: Docs consistency check
        run: |
          test -f README.md
          test -f AI_CONTEXT.md
          test -f AGENTS.md
          test -f CHANGELOG.md
          test -f docs/20-CURRENT-STATE.md

  # PostgreSQL integration tests: the opt-in tenant-integrity suites
  # (RUN_DB_TESTS) against a disposable PostgreSQL 16 service. Kept as a
  # separate job so the standard job above stays fast and database-free.
  # The service credentials below are throwaway values for an ephemeral
  # CI container only — they are not secrets and protect nothing.
  db-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gymsaas_test
          POSTGRES_PASSWORD: gymsaas_test_password
          POSTGRES_DB: gymsaas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gymsaas_test -d gymsaas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Job-level: overrides the workflow placeholder for this job only.
      # Points at the disposable service container, never at a real
      # deployment or developer database.
      DATABASE_URL: postgresql://gymsaas_test:gymsaas_test_password@localhost:5432/gymsaas_test
      RUN_DB_TESTS: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply migrations to the disposable database
        run: npx prisma migrate deploy

      - name: PostgreSQL integration tests (Vitest)
        run: npm run test:db

  # Migration upgrade-path test (Phase B): migrate a disposable
  # PostgreSQL 16 service from the pinned previous release (a046fcb,
  # 10 migrations), seed a small synthetic fixture at that baseline
  # schema, then upgrade the same database to HEAD and prove the
  # seeded rows survive (scripts/run-upgrade-test.mjs). This is the
  # only job that ever migrates a non-empty database. Informational —
  # not a required check — mirroring the e2e-auth posture below.
  # Disposable service database only: before contacting any database,
  # the runner enforces a strict disposable-database policy — the name
  # must match the anchored gymsaas_upgrade convention with no
  # production-like segments, the host must be loopback, no
  # target-overriding query parameters are allowed, and
  # UPGRADE_TEST_CONFIRM_DATABASE must exactly name the database.
  db-upgrade:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gymsaas_test
          POSTGRES_PASSWORD: gymsaas_test_password
          POSTGRES_DB: gymsaas_upgrade
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gymsaas_test -d gymsaas_upgrade"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Job-level: overrides the workflow placeholder for this job only.
      # Points at the disposable service container, never at a real
      # deployment or developer database.
      DATABASE_URL: postgresql://gymsaas_test:gymsaas_test_password@localhost:5432/gymsaas_upgrade
      BASELINE_DIR: upgrade-baseline
      UPGRADE_TEST_CONFIRM_DATABASE: gymsaas_upgrade
    steps:
      - uses: actions/checkout@v4

      - name: Check out the pinned baseline release
        uses: actions/checkout@v4
        with:
          ref: a046fcb5a886f1405b55af7a5fd090c19d7d6af1
          path: upgrade-baseline

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Migration upgrade-path test (seeded)
        run: node scripts/run-upgrade-test.mjs

  # Authenticated Playwright smoke test: a real Clerk sign-in by a
  # test-mode OWNER on the dedicated CI development instance, against a
  # disposable PostgreSQL 16 service. Isolated from the build and
  # db-tests jobs; the E2E OWNER credential is scoped to this job only.
  # If any required secret is missing, migrations fail, sign-in fails,
  # or the smoke test does not execute, this job fails — the harness
  # has no dummy fallbacks (see playwright.auth.config.ts).
  e2e-auth:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gymsaas_test
          POSTGRES_PASSWORD: gymsaas_test_password
          POSTGRES_DB: gymsaas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gymsaas_test -d gymsaas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Disposable service database only — never a real deployment.
      DATABASE_URL: postgresql://gymsaas_test:gymsaas_test_password@localhost:5432/gymsaas_test
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_CI_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_CI_SECRET_KEY }}
      # Test-mode OWNER account on the CI development instance (scoped
      # to this job; the account exists only on that throwaway instance).
      CLERK_E2E_OWNER_EMAIL: ${{ secrets.CLERK_E2E_OWNER_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply migrations to the disposable database
        run: npx prisma migrate deploy

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Authenticated smoke test (Playwright)
        run: npm run test:e2e:auth

      # Diagnostics for failed runs: Playwright's error context and
      # traces (test-results/ only — never the .auth storage state,
      # which lives under tests/e2e-auth/ and is gitignored).
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-auth-playwright-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
