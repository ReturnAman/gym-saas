name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Placeholders only — the foundation never connects to a real database,
  # but Prisma and the build expect the variables to be present.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/gymsaas_ci
  APP_URL: http://localhost:3000
  # Dummy, format-valid Clerk keys so the app boots and builds without real
  # credentials (see playwright.config.ts). Real keys are deployment secrets.
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZHVtbXkubG9jYWwk
  CLERK_SECRET_KEY: sk_test_dummy

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit/application tests (Vitest)
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests (Playwright)
        run: npm run test:e2e

      - name: Production build
        run: npm run build

      - name: Docs consistency check
        run: |
          test -f README.md
          test -f AI_CONTEXT.md
          test -f AGENTS.md
          test -f CHANGELOG.md
          test -f docs/20-CURRENT-STATE.md
