name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Placeholders only — the foundation never connects to a real database,
  # but Prisma and the build expect the variables to be present.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/gymsaas_ci
  APP_URL: http://localhost:3000
  # Dummy, format-valid Clerk keys so the app boots and builds without real
  # credentials (see playwright.config.ts). Real keys are deployment secrets.
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZHVtbXkubG9jYWwk
  CLERK_SECRET_KEY: sk_test_dummy

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        # The generated client (node_modules/.prisma/client) is gitignored and
        # not produced by `npm ci` (no postinstall hook). Typecheck, unit tests
        # and the app all import model types from `@prisma/client`, which
        # re-exports the generated files — without this step the Typecheck
        # step fails with TS2305 (e.g. "has no exported member 'PrismaClient'").
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit/application tests (Vitest)
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: TEMPORARY DIAGNOSTIC - chromium loopback networking, launch-equivalent (REVERT AFTER USE)
        run: |
          echo "=== 0. runner image ==="
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
          grep -E '^(NAME|VERSION)=' /etc/os-release || true
          echo "=== building production bundle (same as webServer) ==="
          npm run build >/tmp/diag-build.log 2>&1
          echo "=== starting server in background ==="
          (npm start >/tmp/diag-server.log 2>&1 & echo $! >/tmp/diag-server.pid)
          echo "=== waiting for readiness ==="
          for i in $(seq 1 30); do
            if curl -sf --max-time 2 http://127.0.0.1:3000/api/health; then break; fi
            sleep 2
          done
          echo "=== 1. listening sockets ==="
          (ss -tlnp | grep ':3000') || echo "(no :3000 listener in ss output)"
          echo "=== 2. proxy env var names ==="
          env | cut -d= -f1 | grep -i proxy || echo "(no proxy env vars)"
          echo "=== 3. resolv.conf ==="
          cat /etc/resolv.conf
          echo "=== 4. curl -> loopback ==="
          curl -sv --max-time 10 http://127.0.0.1:3000/api/health || echo "curl exit code: $?"
          CHROME=$(ls -d ~/.cache/ms-playwright/chromium-*/chrome-linux64/chrome ~/.cache/ms-playwright/chromium-*/chrome-linux/chrome 2>/dev/null | head -1)
          echo "chrome binary: ${CHROME:-NOT FOUND}"
          echo "=== 5. raw chromium (--no-sandbox, Playwright-equivalent) -> loopback ==="
          "$CHROME" --no-sandbox --headless=new --disable-gpu --dump-dom --virtual-time-budget=8000 http://127.0.0.1:3000/api/health 2>/tmp/diag-chrome-local.err | head -c 600
          echo "chrome->loopback exit code: ${PIPESTATUS[0]}"
          echo "chrome stderr (loopback):"; head -c 800 /tmp/diag-chrome-local.err || true
          echo "=== 6/7. raw chromium (--no-sandbox, Playwright-equivalent) -> external ==="
          "$CHROME" --no-sandbox --headless=new --disable-gpu --dump-dom --virtual-time-budget=8000 https://example.com 2>/tmp/diag-chrome-ext.err | head -c 600
          echo "chrome->external exit code: ${PIPESTATUS[0]}"
          echo "chrome stderr (external):"; head -c 800 /tmp/diag-chrome-ext.err || true
          echo "=== stopping diagnostic server ==="
          kill "$(cat /tmp/diag-server.pid)" 2>/dev/null || true
          pkill -f "next-server" || true
          sleep 1
          (ss -tlnp | grep ':3000') && echo "WARNING: port 3000 still in use" || echo "port 3000 free"
        env:
          APP_URL: http://127.0.0.1:3000

      - name: Browser smoke tests (Playwright)
        run: npm run test:e2e

      - name: Production build
        run: npm run build

      - name: Docs consistency check
        run: |
          test -f README.md
          test -f AI_CONTEXT.md
          test -f AGENTS.md
          test -f CHANGELOG.md
          test -f docs/20-CURRENT-STATE.md
