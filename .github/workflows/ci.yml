name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Placeholders only — the foundation never connects to a real database,
  # but Prisma and the build expect the variables to be present.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/gymsaas_ci
  APP_URL: http://localhost:3000
  # Dummy, format-valid Clerk keys so the app boots and builds without real
  # credentials (see playwright.config.ts). Real keys are deployment secrets.
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZHVtbXkubG9jYWwk
  CLERK_SECRET_KEY: sk_test_dummy

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        # The generated client (node_modules/.prisma/client) is gitignored and
        # not produced by `npm ci` (no postinstall hook). Typecheck, unit tests
        # and the app all import model types from `@prisma/client`, which
        # re-exports the generated files — without this step the Typecheck
        # step fails with TS2305 (e.g. "has no exported member 'PrismaClient'").
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit/application tests (Vitest)
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests (Playwright)
        run: |
          echo "=== proxy env var names (values redacted) ==="
          env | cut -d= -f1 | grep -i proxy || echo "(no proxy env vars)"
          echo "=== /etc/hosts ==="
          cat /etc/hosts
          echo "=== /etc/resolv.conf ==="
          cat /etc/resolv.conf
          npm run test:e2e
        env:
          # TEMPORARY DIAGNOSTIC: log the exact Chromium launch command line
          # to diagnose net::ERR_NAME_NOT_RESOLVED. Revert after diagnosis.
          DEBUG: pw:browser

      - name: Production build
        run: npm run build

      - name: Docs consistency check
        run: |
          test -f README.md
          test -f AI_CONTEXT.md
          test -f AGENTS.md
          test -f CHANGELOG.md
          test -f docs/20-CURRENT-STATE.md
